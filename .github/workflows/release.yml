name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 还原签名证书
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/lightdrop.jks
          fi

      - name: 构建
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: bash build.sh

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/LightDrop-*.apk
          generate_release_notes: true
